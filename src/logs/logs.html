<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Review Rail — logs</title>
  <style>
    :root {
      --bg: #f6f6f4; --card: #ffffff; --text: #1f2124; --text-2: #5f6368;
      --text-3: #9aa0a6; --border: #e3e3e0; --accent: #185fa5;
      --ok: #3b6d11; --danger: #a32d2d; --code-bg: #f0f0ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1c1e; --card: #242528; --text: #e8eaed; --text-2: #b6bac0;
        --text-3: #80868b; --border: #3c4043; --accent: #85b7eb;
        --ok: #97c459; --danger: #e24b4a; --code-bg: #313235;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px; color: var(--text); background: var(--bg);
      display: flex; justify-content: center; padding: 40px 16px 60px;
    }
    .page { width: 100%; max-width: 720px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    h1 { font-size: 18px; font-weight: 600; }
    .badge {
      font-size: 12px; padding: 2px 9px; border-radius: 10px;
      background: var(--code-bg); color: var(--danger);
    }
    .spacer { flex: 1; }
    label.filter { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 6px 16px; margin-bottom: 14px;
    }
    .row { padding: 9px 0; border-bottom: 1px solid var(--border); font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.5; }
    .row:last-child { border-bottom: none; }
    .row .line { display: flex; gap: 10px; }
    .ts { color: var(--text-3); flex-shrink: 0; }
    .lvl { flex-shrink: 0; font-weight: 600; }
    .lvl.error { color: var(--danger); }
    .lvl.info { color: var(--text-3); }
    .src { color: var(--text-3); flex-shrink: 0; width: 60px; }
    .msg { color: var(--text); word-break: break-word; }
    .row.info .msg { color: var(--text-2); }
    .count { color: var(--text-3); flex-shrink: 0; }
    .detail, .hint { margin: 2px 0 0 0; padding-left: 0; color: var(--text-3); word-break: break-word; }
    .hint { color: var(--accent); }
    .empty { text-align: center; color: var(--text-3); padding: 30px 0; }
    .actions { display: flex; gap: 10px; }
    button {
      border: 1px solid var(--border); background: none; color: var(--text);
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
      font-family: inherit;
    }
    button:hover { background: var(--code-bg); }
    .note { font-size: 12px; color: var(--text-3); margin-top: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <h1>Logs</h1>
      <span id="err-badge" class="badge" hidden></span>
      <span class="spacer"></span>
      <label class="filter"><input type="checkbox" id="errors-only" /> Errors only</label>
    </div>
    <div class="card" id="list"></div>
    <div class="actions">
      <button id="copy">Copy all</button>
      <button id="clear">Clear</button>
    </div>
    <p class="note">
      Logs never contain your token, MR titles, or usernames — only API
      endpoint paths (with numeric project and MR ids), HTTP statuses, GitLab
      error messages, and the GitLab host you configured. Still, review
      before pasting anywhere public.
    </p>
  </div>
  <script src="logs.js"></script>
</body>
</html>
