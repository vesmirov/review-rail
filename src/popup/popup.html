<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <span class="logo">Review Rail</span>
    <span class="version" id="about-version"></span>
    <span class="count" id="queue-count">0</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="open-options" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="queue">Queue</button>
    <button class="tab" data-tab="stats">Stats</button>
  </nav>

  <main id="view-queue" class="view"></main>
  <main id="view-stats" class="view hidden"></main>

  <footer class="bottom">
    <button class="icon-btn" id="sync-now" title="Sync now">
      <svg id="sync-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
    </button>
    <span id="sync-status" class="muted"></span>
    <span class="spacer"></span>
    <a class="foot-link" href="https://github.com/vesmirov/review-rail/issues" target="_blank" rel="noreferrer">Report an issue</a>
    <button class="icon-btn log-btn" id="open-logs" title="Logs">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5l-5 5"/><path d="M12 19h7"/></svg>
      <span id="log-dot" class="log-dot hidden"></span>
    </button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
